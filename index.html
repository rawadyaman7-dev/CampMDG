<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>The Race</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<style>
:root{
  --bg:#0b0f14; --panel:#141b24; --panel2:#1b242f; --line:#26323f;
  --text:#eaf1f8; --muted:#8ea0b4; --accent:#38bdf8;
  --good:#22c55e; --bad:#ef4444; --warn:#f59e0b;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
}
.wrap{max-width:620px;margin:0 auto;padding:16px;padding-block:16px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;font-weight:700}
h3{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{
  font:inherit;width:100%;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:#06131c;font-weight:700;
  border-radius:12px;padding:13px 18px;width:100%;text-align:center;
  transition:transform .08s ease, filter .15s ease
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.good{background:var(--good);color:#04180b}
.btn.bad{background:var(--bad);color:#2a0505}
.btn.sm{padding:9px 13px;font-size:14px;width:auto}
.row{display:flex;gap:8px}
.row>*{flex:1}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.center{text-align:center}
.hide{display:none !important}
.stack>*+*{margin-top:10px}

.topbar{
  position:sticky;top:0;z-index:20;background:rgba(11,15,20,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)
}
.topbar .wrap{padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:5px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}

.progress{display:flex;gap:5px;margin:14px 0 6px}
.progress i{flex:1;height:7px;border-radius:99px;background:var(--panel2)}
.progress i.on{background:var(--accent)}
.progress i.now{background:var(--warn)}

.dots{display:flex;gap:8px;margin-top:12px}
.dots i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel2);border:2px solid var(--line);font-size:15px;font-style:normal}
.dots i.on{background:var(--good);border-color:var(--good);color:#04180b;font-weight:800}
.dots i.pend{border-color:var(--warn);color:var(--warn)}

.hero{border-radius:var(--radius);padding:20px;border:1px solid var(--line);
  background:linear-gradient(160deg,var(--panel2),var(--panel));margin-bottom:12px}
.hero.unlocked{border-color:var(--good);
  background:linear-gradient(160deg,rgba(34,197,94,.16),var(--panel))}
.hero.waiting{border-color:var(--warn);
  background:linear-gradient(160deg,rgba(245,158,11,.14),var(--panel))}
.hero.done{border-color:var(--accent);
  background:linear-gradient(160deg,rgba(56,189,248,.18),var(--panel))}
.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.place{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.task{margin-top:14px;padding:12px 14px;background:rgba(0,0,0,.28);border-radius:12px;border:1px solid var(--line)}

.item{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.item .grow{flex:1;min-width:0}
.item h4{margin:0;font-size:15px;font-weight:700}
.pill{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.todo{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.pill.pending{background:rgba(245,158,11,.18);color:var(--warn)}
.pill.approved{background:rgba(34,197,94,.18);color:var(--good)}
.pill.rejected{background:rgba(239,68,68,.18);color:var(--bad)}

.tabs{display:flex;gap:6px;background:var(--panel2);padding:5px;border-radius:12px;margin-bottom:12px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:1;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:600;
  color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}

.lb{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--line);margin-bottom:7px}
.lb .rank{width:26px;font-weight:800;color:var(--muted);font-size:15px;text-align:center}
.lb .bar{height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.lb .bar span{display:block;height:100%;border-radius:99px}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(4,7,10,.72);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet .inner{background:var(--panel);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:18px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

.drop{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;background:var(--panel2)}
.preview{width:100%;border-radius:12px;max-height:320px;object-fit:contain;background:#000;display:block}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 18px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);
  max-width:calc(100vw - 32px)}
.toast.bad{border-color:var(--bad)}
.toast.good{border-color:var(--good)}

.media{width:100%;border-radius:12px;background:#000;max-height:340px;object-fit:contain;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.sep{height:1px;background:var(--line);margin:14px 0}
code.k{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:3px 8px;font-size:15px;letter-spacing:.08em;font-weight:700}
a{color:var(--accent)}
</style>
</head>

<script>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mediaUrl = p => `${SUPABASE_URL}/storage/v1/object/public/media/${p}`;

let toastTimer;
function toast(msg, kind){
  clearTimeout(toastTimer);
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const d = document.createElement("div");
  d.className = "toast " + (kind || "");
  d.textContent = msg;
  document.body.appendChild(d);
  toastTimer = setTimeout(() => d.remove(), 3400);
}

async function rpc(fn, args){
  if (!CONFIGURED) throw new Error("Supabase keys are not set in index.html");
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw error;
  return data;
}

/* ---------------------------------------------------------------------
   Upload — photos get squeezed down so they fly on a weak signal,
   videos go up untouched.
   --------------------------------------------------------------------- */
async function shrinkImage(file){
  try {
    const bmp = await createImageBitmap(file);
    const max = 1600;
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (scale === 1 && file.size < 900_000) return file;
    const c = document.createElement("canvas");
    c.width  = Math.round(bmp.width  * scale);
    c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
    return (blob && blob.size < file.size) ? new File([blob], "photo.jpg", { type:"image/jpeg" }) : file;
  } catch { return file; }
}

async function uploadMedia(file, teamId, onProgress){
  let f = file;
  if ((file.type || "").startsWith("image")) f = await shrinkImage(file);
  const ext  = (f.name.split(".").pop() || "bin").toLowerCase().slice(0, 5);
  const path = `${teamId}/${Date.now()}-${Math.random().toString(36).slice(2, 9)}.${ext}`;
  onProgress && onProgress(15);
  const { error } = await sb.storage.from("media").upload(path, f, {
    contentType: f.type || "application/octet-stream", upsert: false
  });
  if (error) throw error;
  onProgress && onProgress(100);
  return { path, type: f.type || "" };
}

/* =====================================================================
   TEAM APP
   ===================================================================== */
const T = { code:"", state:null, tab:"todo", poll:null };

function stageLabel(s){
  return { challenges:"Banking challenges", travel:"On the move",
           checkpoint_review:"Waiting on approval", finished:"Finished" }[s] || s;
}

async function refreshTeam(quiet){
  try {
    const d = await rpc("team_state", { p_code: T.code });
    if (!d || d.ok === false){
      LS.code = ""; T.code = ""; stopPoll(); renderLogin("That code didn't work.");
      return;
    }
    T.state = d;
    renderTeam();
  } catch (e) { if (!quiet) toast(e.message || "Connection problem", "bad"); }
}

function startPoll(fn, ms){ stopPoll(); T.poll = setInterval(fn, ms); }
function stopPoll(){ if (T.poll) clearInterval(T.poll); T.poll = null; }

/* --- login ---------------------------------------------------------- */
async function renderLogin(msg){
  let pub = null;
  try { if (CONFIGURED) pub = await rpc("game_public", {}); } catch {}

  app.innerHTML = `
    <div class="wrap" style="padding-top:44px">
      <div class="center" style="margin-bottom:26px">
        <div style="font-size:52px;line-height:1">🏁</div>
        <h1 style="margin-top:10px">${esc(pub?.game_name || "The Race")}</h1>
        <p class="muted small" style="margin-top:6px">Four teams. One finish line nobody has seen.</p>
      </div>

      ${!CONFIGURED ? `<div class="card" style="border-color:var(--warn)">
        <h2>Not connected yet</h2>
        <p class="small muted" style="margin-top:8px">Open <code class="k">index.html</code> and paste your
        Supabase project URL and anon key into the CONFIG block at the top.</p></div>` : ""}

      <div class="card">
        <div class="field">
          <label>Your team code</label>
          <input id="code" placeholder="RED-4821" autocapitalize="characters"
                 autocomplete="off" spellcheck="false" style="text-align:center;font-size:20px;
                 font-weight:800;letter-spacing:.12em">
        </div>
        ${msg ? `<p class="small" style="color:var(--bad);margin-bottom:10px">${esc(msg)}</p>` : ""}
        <button class="btn" id="go">Enter the race</button>
      </div>

      ${pub?.leaderboard?.length ? `
        <h3 style="margin:22px 0 10px">Standings</h3>

      <p class="center tiny muted" style="margin-top:26px">
        <a href="#admin">Organiser</a>
      </p>
    </div>`;

  const input = document.getElementById("code");
  const go = async () => {
    const v = input.value.trim();
    if (!v) return;
    T.code = v; LS.code = v;
    await refreshTeam();
  };
  document.getElementById("go").onclick = go;
  input.onkeydown = e => { if (e.key === "Enter") go(); };
}

/* --- leaderboard ---------------------------------------------------- */
function leaderboardHTML(list, totalLegs){
  return list.map((t, i) => {
    // each team walks its own route, so progress is measured against its own length
    const total = t.total || totalLegs || 5;
    const done = t.finished_at;
    const pct = done ? 100
      : Math.min(100, ((t.current_leg - 1) / total) * 100 +
        (t.required ? (t.banked / t.required) * (100 / total) : 0));
    const where = done ? "Finished"
      : t.stage === "travel" ? `Heading to stop ${t.current_leg}`
      : t.stage === "checkpoint_review" ? `At stop ${t.current_leg}, waiting`
      : `${t.banked}/${t.required} for stop ${t.current_leg}`;
    return `<div class="lb">
      <div class="rank">${done ? "🏆" : i + 1}</div>
      <div style="flex:1;min-width:0">
        <div class="between">
          <strong style="font-size:15px">${esc(t.emoji)} ${esc(t.name)}</strong>
          <span class="tiny muted">${esc(where)}</span>
        </div>
        <div class="bar"><span style="width:${pct}%;background:${esc(t.color)}"></span></div>
      </div>
    </div>`;
  }).join("");
}

/* --- team home ------------------------------------------------------ */
function renderTeam(){
  const d = T.state, t = d.team, leg = d.leg || {};
  const total = d.total_legs || 5;

  let hero = "";
  if (!d.started){
    hero = `<div class="hero waiting">
      <div class="kicker">Hold tight</div>
      <div class="place">The race hasn't started</div>
      <p class="muted small" style="margin-top:8px">Your organiser starts it from their screen. This page updates on its own.</p>
    </div>`;
  } else if (t.stage === "finished"){
    hero = `<div class="hero done center">
      <div style="font-size:48px">🏆</div>
      <div class="place" style="margin-top:8px">You made it</div>
      <p class="muted small" style="margin-top:8px">Finished at ${new Date(t.finished_at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</p>
    </div>`;
  } else if (t.stage === "travel"){
    hero = `<div class="hero unlocked">
      <div class="kicker">${leg.is_final ? "Final destination unlocked" : `Stop ${leg.idx} unlocked`}</div>
      <div class="place">${esc(leg.stop_name || "")}</div>
      <p style="margin-top:10px;font-size:17px">${esc(leg.location_text || "")}</p>
      ${leg.hint ? `<p class="muted small" style="margin-top:8px">💡 ${esc(leg.hint)}</p>` : ""}
      ${leg.map_url ? `<p style="margin-top:10px"><a href="${esc(leg.map_url)}" target="_blank" rel="noopener">Open in maps →</a></p>` : ""}
      <div class="task">
        <div class="kicker">Your photo when you arrive</div>
        <p style="margin-top:6px">${esc(leg.photo_task || "")}</p>
      </div>
      <button class="btn" style="margin-top:14px" onclick="openSubmit('checkpoint')">📸 Submit arrival photo</button>
    </div>`;
  } else if (t.stage === "checkpoint_review"){
    hero = `<div class="hero waiting">
      <div class="kicker">Sent for approval</div>
      <div class="place">Waiting on the organiser</div>
      <p class="muted small" style="margin-top:8px">If it's rejected you'll be able to retake it right here.</p>
    </div>`;
  } else {
    const need = leg.required || 0, have = d.banked || 0;
    const pend = (d.challenges || []).filter(c => c.status === "pending").length;
    hero = `<div class="hero">
      <div class="kicker">${leg.is_final ? "Last push" : `Working toward stop ${leg.idx}`}</div>
      <div class="place">${have}/${need} challenges banked</div>
      <div class="dots">${Array.from({length:need}, (_, i) =>
        `<i class="${i < have ? "on" : (i < have + pend ? "pend" : "")}">${i < have ? "✓" : i + 1}</i>`).join("")}</div>
      <p class="muted small" style="margin-top:12px">
        ${have >= need ? "Unlocking…" :
          `Get ${need - have} more approved and the location drops.${pend ? ` ${pend} waiting on approval.` : ""}`}</p>
    </div>`;
  }

  const ch = d.challenges || [];
  const groups = {
    todo:     ch.filter(c => !c.status || c.status === "rejected"),
    pending:  ch.filter(c => c.status === "pending"),
    done:     ch.filter(c => c.status === "approved")
  };
  const list = groups[T.tab] || [];

  app.innerHTML = `
    <div class="topbar"><div class="wrap">
      <div>
        <strong style="font-size:17px">${esc(t.emoji)} ${esc(t.name)}</strong>
        <div class="tiny muted">${esc(stageLabel(t.stage))}</div>
      </div>
      <span class="badge">${t.stage === "finished" ? "Done" : `Stop ${t.current_leg} of ${total}`}</span>
    </div></div>

    <div class="wrap">
      <div class="progress">${Array.from({length:total}, (_, i) => {
        const n = i + 1;
        return `<i class="${n < t.current_leg || t.stage === "finished" ? "on" : n === t.current_leg ? "now" : ""}"></i>`;
      }).join("")}</div>

      ${hero}

      ${t.stage === "challenges" && d.started ? `
        <h3 style="margin:22px 0 10px">Challenge pool</h3>
        <div class="tabs">
          <button data-tab="todo"    class="${T.tab==="todo"?"on":""}">To do ${groups.todo.length}</button>
          <button data-tab="pending" class="${T.tab==="pending"?"on":""}">Waiting ${groups.pending.length}</button>
          <button data-tab="done"    class="${T.tab==="done"?"on":""}">Banked ${groups.done.length}</button>
        </div>
        ${list.length ? list.map(c => `
          <div class="item">
            <div class="grow">
              <h4>${esc(c.title)}</h4>
              ${c.description ? `<p class="small muted" style="margin-top:3px">${esc(c.description)}</p>` : ""}
              ${c.status === "rejected" && c.admin_note ?
                `<p class="small" style="color:var(--bad);margin-top:6px">Rejected: ${esc(c.admin_note)}</p>` : ""}
            </div>
            ${(!c.status || c.status === "rejected")
              ? `<button class="btn sm" onclick="openSubmit('challenge','${c.id}')">Submit</button>`
              : `<span class="pill ${c.status}">${c.status === "approved" ? "Banked" : "Waiting"}</span>`}
          </div>`).join("")
          : `<p class="muted small center" style="padding:18px">Nothing here.</p>`}
      ` : ""}

      <h3 style="margin:22px 0 10px">Standings</h3>
      ${leaderboardHTML(d.leaderboard || [], total)}

      ${(d.feed || []).length ? `
        <h3 style="margin:22px 0 10px">Recent decisions</h3>
        ${d.feed.slice(0, 6).map(f => `
          <div class="item">
            <div class="grow">
              <h4>${esc(f.title)}</h4>
              ${f.admin_note ? `<p class="small muted" style="margin-top:3px">${esc(f.admin_note)}</p>` : ""}
            </div>
            <span class="pill ${f.status}">${f.status}</span>
          </div>`).join("")}` : ""}

      <p class="center tiny muted" style="margin:26px 0 10px">
        <button onclick="logout()" style="color:var(--muted);text-decoration:underline">Leave team</button>
      </p>
    </div>`;

  document.querySelectorAll(".tabs button").forEach(b =>
    b.onclick = () => { T.tab = b.dataset.tab; renderTeam(); });
}

function logout(){
  LS.code = ""; T.code = ""; T.state = null; stopPoll(); renderLogin();
}

/* --- submit sheet --------------------------------------------------- */
let pending = null;

function openSubmit(kind, challengeId){
  const d = T.state;
  const ch = kind === "challenge"
    ? (d.challenges || []).find(c => c.id === challengeId) : null;
  pending = { kind, challengeId, file:null };

  modal.innerHTML = `
    <div class="sheet" id="sheet"><div class="inner">
      <div class="between" style="margin-bottom:14px">

      </div>

                               : esc(d.leg?.photo_task || "Send your arrival photo.")}

      </div>
      <input type="file" id="cam" accept="image/*,video/*" capture="environment" class="hide">
      <input type="file" id="lib" accept="image/*,video/*" class="hide">

      <div class="field" style="margin-top:14px">
        <label>Note for the organiser (optional)</label>
        <textarea id="note" placeholder="Anything they should know"></textarea>
      </div>

      <div class="bar hide" id="bar"><span></span></div>
      <button class="btn" id="send" style="margin-top:8px" disabled>Send for approval</button>
      <p class="tiny muted center" style="margin-top:10px">Big videos take a while on a weak signal — keep the app open.</p>
    </div></div>`;

  const cam = document.getElementById("cam"), lib = document.getElementById("lib");
  document.getElementById("camBtn").onclick = () => cam.click();
  document.getElementById("libBtn").onclick = () => lib.click();
  [cam, lib].forEach(inp => inp.onchange = () => pick(inp.files[0]));
  document.getElementById("send").onclick = send;
  document.getElementById("sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };
}

function pick(file){
  if (!file) return;
  pending.file = file;
  const mb = (file.size / 1048576).toFixed(1);
  const url = URL.createObjectURL(file);
  document.getElementById("pv").innerHTML = isVideo(file.type)
    ? `<video class="preview" src="${url}" controls playsinline></video>
       <p class="tiny muted center" style="margin:6px 0 10px">${mb} MB${file.size > 45e6 ? " — that's large, it may fail to upload" : ""}</p>`
    : `<img class="preview" src="${url}">
       <p class="tiny muted center" style="margin:6px 0 10px">Will be compressed before sending</p>`;
  document.getElementById("drop").classList.add("hide");
  document.getElementById("send").disabled = false;
}

function closeSheet(){ modal.innerHTML = ""; pending = null; }

async function send(){
  if (!pending?.file) return;
  const btn = document.getElementById("send");
  const bar = document.getElementById("bar");
  btn.disabled = true; btn.textContent = "Uploading…";
  bar.classList.remove("hide");
  const setPct = p => bar.firstElementChild.style.width = p + "%";

  try {
    const m = await uploadMedia(pending.file, T.state.team.id, setPct);
    const note = document.getElementById("note").value.trim() || null;
    const res = pending.kind === "challenge"
      ? await rpc("submit_challenge", { p_code:T.code, p_challenge_id:pending.challengeId,
          p_media_path:m.path, p_media_type:m.type, p_note:note })
      : await rpc("submit_checkpoint", { p_code:T.code,
          p_media_path:m.path, p_media_type:m.type, p_note:note });

    if (res?.ok === false){
      const msg = { NOT_STARTED:"The race hasn't started yet.",
                    WRONG_STAGE:"That's not what you're on right now — refresh.",
                    ALREADY_SUBMITTED:"Already sent." }[res.error] || res.error;
      toast(msg, "bad");
      btn.disabled = false; btn.textContent = "Send for approval"; bar.classList.add("hide");
      return;
    }
    closeSheet();
    toast("Sent — waiting for approval", "good");
    refreshTeam(true);
  } catch (e){
    toast(e.message || "Upload failed — try again", "bad");
    btn.disabled = false; btn.textContent = "Send for approval"; bar.classList.add("hide");
  }
}

/* Each team walks its own list of stops; everyone ends at one shared
   final destination. */
function panelRoute(){
  const teams = A.data.teams;
  const legs  = A.data.legs;
  const final = legs.find(l => !l.team_id && l.is_final) || null;

  if (!A.routeTeam || !teams.some(t => t.id === A.routeTeam))
    A.routeTeam = teams[0]?.id || null;
  const team = teams.find(t => t.id === A.routeTeam);
  const mine = legs.filter(l => l.team_id === A.routeTeam)
                   .sort((a, b) => a.idx - b.idx);

  // The pool has to cover the hungriest route, since a team can't reuse a challenge.
  const need = Math.max(0, ...teams.map(t =>
    legs.filter(l => l.team_id === t.id).reduce((s, l) => s + l.required_challenges, 0)
    + (final ? final.required_challenges : 0)));
  const have = A.data.challenges.filter(c => c.active).length;

  const legCard = (l, n) => `
    <div class="card">
      <div class="between">
        <strong>${l.is_final ? "🏁 " : `${n}. `}${esc(l.stop_name)}</strong>
        <span class="pill todo">${l.required_challenges} challenges</span>
      </div>
      <p class="small muted" style="margin-top:8px">📍 ${esc(l.location_text || "— no location set —")}</p>
      <p class="small muted" style="margin-top:4px">📸 ${esc(l.photo_task || "— no photo task set —")}</p>
      <button class="btn ghost sm" style="margin-top:12px;width:100%"
              onclick="editLeg('${l.id}')">Edit</button>
    </div>`;

  document.getElementById("panel").innerHTML = `
    ${have < need ? `<div class="card" style="border-color:var(--warn)">
      <strong>Pool too small</strong>
      <p class="small muted" style="margin-top:6px">The longest route costs ${need} challenges in
      total and a team can't reuse one, but only ${have} are active. Add ${need - have} more.</p></div>` : ""}

    <div class="tabs" style="margin-bottom:14px">
      ${teams.map(t => `<button data-rt="${t.id}" class="${t.id === A.routeTeam ? "on" : ""}">
        ${esc(t.emoji)} ${esc(t.name)}</button>`).join("")}
    </div>

    <p class="small muted" style="margin-bottom:12px">
      ${esc(team?.name || "")}'s own stops — ${mine.length} of them, then the shared finish line.
    </p>

    ${mine.length ? mine.map((l, i) => legCard(l, i + 1)).join("")
      : `<p class="muted small center" style="padding:18px">No stops yet for this team.</p>`}

    <div class="row" style="margin-bottom:20px">
      <button class="btn ghost" onclick="editLeg(null,'${A.routeTeam}')">+ Add stop</button>
      <button class="btn ghost" onclick="copyRoute()">Copy route to…</button>
    </div>

    <h3 style="margin:22px 0 10px">Shared finish line — every team</h3>
    ${final ? legCard(final, "🏁")
      : `<button class="btn ghost" onclick="editLeg(null,null,true)">+ Set the final destination</button>`}`;

  document.querySelectorAll("[data-rt]").forEach(b =>
    b.onclick = () => { A.routeTeam = b.dataset.rt; renderAdmin(); });
}

function copyRoute(){
  const from = A.data.teams.find(t => t.id === A.routeTeam);
  const others = A.data.teams.filter(t => t.id !== A.routeTeam);
  if (!others.length) return;
  sheet(`Copy ${from.name}'s route`, `
    <p class="small muted" style="margin-bottom:14px">Replaces that team's stops with a copy of
    ${esc(from.name)}'s, so you can tweak them instead of typing from scratch. The finish line
    is shared and isn't touched.</p>
    <div class="field"><label>Copy onto</label>
      <select id="f_to">${others.map(t =>
        `<option value="${t.id}">${esc(t.emoji)} ${esc(t.name)}</option>`).join("")}</select></div>
  `, async () => rpc("admin_copy_route", { p_pin:A.pin, p_from:A.routeTeam, p_to:val("f_to") }));
}

function editLeg(id, teamId, forceFinal){
  const l = id ? A.data.legs.find(x => x.id === id) : null;
  const owner = l ? l.team_id : (teamId || null);
  const isFinal = l ? l.is_final : !!forceFinal;
  const team = A.data.teams.find(t => t.id === owner);
  const mine = A.data.legs.filter(x => x.team_id === owner);
  const nextIdx = mine.length ? Math.max(...mine.map(x => x.idx)) + 1 : 1;

  sheet(isFinal ? "Final destination" : (l ? "Edit stop" : `New stop for ${team?.name || ""}`), `
    ${isFinal ? `<p class="small muted" style="margin-bottom:14px">Every team finishes here.</p>` : ""}
    <div class="grid2">
      ${isFinal ? "" : `<div class="field"><label>Order in ${esc(team?.name || "the route")}</label>
        <input id="f_idx" type="number" min="1" value="${l?.idx ?? nextIdx}"></div>`}
      <div class="field"><label>Challenges to unlock</label>
        <input id="f_req" type="number" min="0" value="${l?.required_challenges ?? 3}"></div>
    </div>
    <div class="field"><label>Stop name (teams see this)</label>

    <div class="field"><label>Photo they must send on arrival</label>

    ${l ? `<button class="btn bad" style="margin-bottom:10px" onclick="delLeg('${l.id}')">Delete</button>` : ""}
  `, async () => {
    await rpc("admin_upsert_leg", { p_pin:A.pin, p_id:id || null,
      p_team_id:isFinal ? null : owner,
      p_idx:isFinal ? 999 : parseInt(val("f_idx"), 10),

      p_hint:val("f_hint") || null, p_photo_task:val("f_task"),
      p_required:parseInt(val("f_req"), 10),
      p_is_final:isFinal });
  });
}

    </div></div>`;
  document.getElementById("sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };
  document.getElementById("save").onclick = async () => {
    const b = document.getElementById("save");
    b.disabled = true; b.textContent = "Saving…";
    try { const r = await onSave();
      if (r?.ok === false){ toast(r.error === "CODE_TAKEN" ? "That code is already used" : r.error, "bad");
        b.disabled = false; b.textContent = "Save"; return; }
      closeSheet(); toast("Saved", "good"); refreshAdmin();
    } catch (e){ toast(e.message || "Failed", "bad"); b.disabled = false; b.textContent = "Save"; }
  };
}

/* =====================================================================
   ROUTING
   ===================================================================== */
async function route(){
  stopPoll(); stopAdminPoll(); closeSheet();

  if (location.hash === "#admin"){
    if (LS.pin){ A.pin = LS.pin; await refreshAdmin(); }
    else renderPin();
    if (A.pin) A.poll = setInterval(() => refreshAdmin(true), 6000);
    return;
  }

  if (LS.code){
    T.code = LS.code;
    await refreshTeam();
    if (T.code) startPoll(() => refreshTeam(true), 8000);
  } else {
    renderLogin();
  }
}

window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible"){
    if (location.hash === "#admin" && A.pin) refreshAdmin(true);
    else if (T.code) refreshTeam(true);
  }
});
route();
</script>
</body>
</html>
